; =============================================================================
; TECNICAS DIGITALES 2 - SUN TRACKER ESP32
; =============================================================================
; Controlador de seguidor solar de 2 ejes (Azimut y Elevacion).
; Migracion de firmware AVR (ATmega168/328) a ESP32 DevKit V1.
;
; - env:tracker        => Carga automatica normal (ajustar upload_port a tu COM)
; - env:tracker_manual => Carga con reset manual (para bootloaders que requieren presionar BOOT)
; =============================================================================

[env]
platform = espressif32
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200

[env:tracker]
board = esp32doit-devkit-v1
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
build_src_filter =
	-<*>
	+<main_tracker.cpp>

[env:tracker_manual]
board = esp32doit-devkit-v1
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
build_src_filter =
	-<*>
	+<main_tracker.cpp>
upload_flags =
	--before
	no_reset
	--after
	hard_reset
