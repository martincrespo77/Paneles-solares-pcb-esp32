; =============================================================================
; TECNICAS DIGITALES 2 - SUN TRACKER ESP32
; =============================================================================
; Controlador de seguidor solar de 2 ejes (Azimut y Elevacion).
; Migracion de firmware AVR (ATmega168/328) a ESP32 DevKit V1.
;
; - env:tracker        => Carga automatica normal (ajustar upload_port a tu COM)
; - env:tracker_manual => Carga con reset manual (para placas que requieren presionar BOOT)
; =============================================================================

[env]
; Version fijada: Arduino-ESP32 core 2.0.17. Builds reproducibles entre equipos.
platform = espressif32@6.13.0
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
	-<*>
	+<main_tracker.cpp>
; Warnings estrictos solo para el codigo propio (no para el framework)
build_src_flags =
	-Wall
	-Wextra
	-Werror

[env:tracker]
upload_port = COM3
upload_speed = 115200
monitor_port = COM3

[env:tracker_manual]
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
upload_flags =
	--before
	no_reset
	--after
	hard_reset
